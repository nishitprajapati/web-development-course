<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Component</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="card">
        <div class="card-image">
            <img src="mahant-swami-maharaj.jpg" alt="Spiritual Portrait">
        </div>

        <div class="card-content">
            <div class="tags">
                <span class="tag">Spiritual Guru</span>
                <span class="tag">BAPS</span>
            </div>

            <h2 class="card-title">Ruchina vachano</h2>

            <p class="card-text">
                Aksharm aham Purushottam dasosmi
            </p>
            <p class="card-text">
                SAMP-Suhradbhav-Ekta
            </p>
            <p class="card-text">
                Gun Grahan, Abhav Avgun tyag
            </p>
            <p class="card-text">
                Prapti no vichar, Sambdhano mahima, Dasbhav
            </p>


            <button class="card-button">Read More</button>
        </div>
    </div>

</body>

</html>
